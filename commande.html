.fuel-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}.fuel-edit{position:absolute;right:10px;top:10px;border:0;background:#191919;color:#fff;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:950;z-index:3}
.fuel-card.empty-fuel{border-color:#e2e2dc}
.fuel-card.fuel-alert{border:2px solid #d64545;background:#fff4f4}
.fuel-card.fuel-alert:before{content:'PLUS DE CARBURANT';position:absolute;right:-42px;top:18px;transform:rotate(34deg);background:#d64545;color:white;padding:6px 45px;font-size:9px;font-weight:1000;letter-spacing:.5px}
.fuel-head{display:flex;align-items:center;gap:12px;margin-bottom:13px}.fuel-icon{width:52px;height:52px;border-radius:15px;background:#fff1d6;display:grid;place-items:center;font-size:27px}.fuel-title{font-size:18px;font-weight:1000}.fuel-sub{font-size:10px;color:var(--muted);font-weight:800;margin-top:2px}
.fuel-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.fuel-num{background:#f5f5f2;border-radius:13px;padding:9px 6px;text-align:center}.fuel-num span{display:block;font-size:8px;text-transform:uppercase;color:var(--muted);font-weight:950}.fuel-num strong{display:block;font-size:19px;margin-top:2px}.fuel-num.used{background:#fff0ea}.fuel-num.used strong{color:#c94b20}.fuel-num.left{background:#edf7f0}.fuel-num.left strong{color:var(--green)}.fuel-card.fuel-alert .fuel-num.left{background:#ffe3e3}.fuel-card.fuel-alert .fuel-num.left strong{color:#c52d2d}
.fuel-fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fuel-field label{display:block;font-size:10px;font-weight:900;color:#555;margin:0 0 5px}.fuel-field-wrap{display:flex;align-items:center;background:#f5f5f2;border:1px solid #e7e7e1;border-radius:13px;overflow:hidden}.fuel-field input{width:100%;border:0;background:transparent;padding:12px 10px;font-size:18px;font-weight:950;outline:none}.fuel-unit{padding:0 10px;color:#777;font-size:11px;font-weight:950}
.fuel-saved{margin-top:9px;font-size:9px;color:var(--green);font-weight:850;text-align:right}
.fuel-add{min-height:190px;border:2px dashed #e0b762;background:#fffaf0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;color:#7b571d;font-weight:950;text-align:center;box-shadow:0 5px 18px rgba(0,0,0,.025)}
.fuel-add:active{transform:scale(.99)}
.fuel-add .fuel-add-plus{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff0cc;border:1px solid #efcf8d;font-size:31px;line-height:1}
.fuel-add small{font-size:10px;color:#8a7147;font-weight:800}
@media(min-width:720px){.fuel-dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.fuel-intro{grid-column:1/-1}}
@media(max-width:620px){.stock-row{grid-template-columns:43px minmax(0,1fr)}.stock-icon{width:43px;height:43px}.stock-numbers{grid-column:1/-1;min-width:0}.stock-summary{gap:7px}.summary-card{padding:11px}.summary-card strong{font-size:21px}.iconbtn .label-hide{display:none}}
@media(min-width:720px){.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.item-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cat-card{min-height:178px}.item-photo{height:185px}}
@media(min-width:1050px){.category-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.item-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.public-main{max-width:920px;margin:auto;padding:18px 14px 110px}
.public-title{margin:4px 0 16px} .public-title h2{margin:0;font-size:24px} .public-title p{margin:4px 0;color:var(--muted)}
.public-search{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;margin-bottom:14px}
.public-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.public-cat{border:0;background:#fff;border-radius:18px;padding:16px;text-align:left;min-height:112px;box-shadow:var(--shadow)}

.public-name{font-weight:950} .public-meta{font-size:12px;color:var(--muted);margin-top:3px}
.public-step{display:flex;align-items:center;gap:7px;margin-top:8px} .public-step button{border:0;border-radius:10px;width:35px;height:35px;font-size:20px;font-weight:950}
.public-step .p{background:var(--accent);color:#fff} .public-step strong{min-width:24px;text-align:center}
.public-bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(244,244,242,.96);backdrop-filter:blur(8px);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.public-bottom>div{max-width:920px;margin:auto} .public-send{width:100%;border:0;border-radius:15px;background:var(--accent);color:#fff;padding:15px;font-weight:950}
.public-send:disabled{opacity:.42}.public-bottom-actions{display:grid;grid-template-columns:1fr;gap:8px}.public-categories-btn{width:100%;border:2px solid var(--accent);border-radius:15px;background:#fff;color:var(--accent);padding:13px 14px;font-weight:950} .public-count{text-align:center;font-size:12px;font-weight:850;margin-bottom:6px}
.public-form{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)} .public-form input,.public-form textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:9px}
.public-ok{background:#fff;border-radius:20px;padding:32px;text-align:center;box-shadow:var(--shadow)} .public-num{font-size:38px;font-weight:1000;color:var(--accent)}

<header class="appbar"><div class="logo">PM</div><div class="brand"><b>Parc Matériel</b><span>Demande de matériel</span></div></header>
<main class="public-main"><div class="public-title"><h2>Choisir le matériel</h2><p>Consulte le stock disponible et prépare ta demande.</p></div>
<input id="search" class="public-search" placeholder="🔎 Rechercher du matériel…" oninput="render()">
<div id="nav"></div><div id="content"><div class="empty">Chargement du stock…</div></div></main>
<div class="public-bottom" id="bottom"><div><div id="count" class="public-count"></div><div class="public-bottom-actions"><button class="public-categories-btn" onclick="goCategories()">📂 Catégories</button><button id="next" class="public-send" onclick="showForm()" disabled>Continuer ma commande</button></div></div></div>
<script>
const SUPA='https://stmatwcsvntzdglardci.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0bWF0d2Nzdm50emRnbGFyZGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTU3MDgsImV4cCI6MjEwNjc3MTcwOH0.CksaSBicB5JsGQYDiaCdbEp-tfs8LW7vj4BrYsJXpeE';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY};
const STATIC_CATEGORIES=[];
let D=null,photos={},cart={},active=null,items=[],cats=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(path){let r=await fetch(SUPA+'/rest/v1/app_settings'+path,{headers:HEAD});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function normalize(){
 const c=D.catalogData||[]; cats=[];items=[];
 if(Array.isArray(c)){
   for(let i=0;i<c.length;i++){
     const v=c[i]||{}, name=v.name||('Catégorie '+(i+1)), id=v.id||('c'+i), icon=v.icon||'📦';
     cats.push({id,name,icon});
     for(const z of (Array.isArray(v.items)?v.items:[])){
       const n=typeof z==='string'?z:z?.name;
       if(n)items.push({cat:id,catName:name,name:n,icon});
     }
   }
 } else if(c && typeof c==='object'){
   let i=0;
   for(const [name,v] of Object.entries(c)){
     const arr=Array.isArray(v)?v:(v&&Array.isArray(v.items)?v.items:[]);
     if(!arr.length)continue;
     const id=v?.id||('c'+i++), icon=v?.icon||'📦';
     cats.push({id,name,icon});
     for(const z of arr){const n=typeof z==='string'?z:z?.name;if(n)items.push({cat:id,catName:name,name:n,icon})}
   }
 }
}
function outs(){let o={};for(const e of(D.history||[])){for(const [n,q] of(e.items||[])){o[n]=(o[n]||0)+Number(q||0)}}for(const e of(D.returns||[])){for(const [n,q] of(e.items||[])){o[n]=(o[n]||0)-Number(q||0)}}return o}
function available(n){return Math.max(0,Number((D.stockData||{})[n]||0)-(outs()[n]||0))}
function choose(id){active=id;document.getElementById('search').value='';render()} function back(){active=null;render()} function goCategories(){active=null;const q=document.getElementById('search');q.value='';q.style.display='';render();window.scrollTo({top:0,behavior:'smooth'})}
function qty(n,d,m){cart[n]=Math.max(0,Math.min(m,(cart[n]||0)+d));if(!cart[n])delete cart[n];render()}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase(), nav=document.getElementById('nav'),out=document.getElementById('content');
 if(!active&&!q){nav.innerHTML='';out.innerHTML='<div class="public-grid">'+cats.map(c=>`<button class="public-cat" onclick="choose('${c.id}')"><div class="em">${c.icon}</div><b>${esc(c.name)}</b><small>${items.filter(x=>x.cat===c.id&&available(x.name)>0).length} disponibles</small></button>`).join('')+'</div>'}
 else{nav.innerHTML=active?'<button class="public-back" onclick="back()">← Catégories</button>':'';let a=items.filter(x=>(!active||x.cat===active)&&(!q||x.name.toLowerCase().includes(q)||x.catName.toLowerCase().includes(q))&&available(x.name)>0);out.innerHTML=a.map(x=>`<article class="public-item"><div class="public-photo">${photos[x.name]?`<img src="${photos[x.name]}">`:x.icon}</div><div class="public-info"><div class="public-name">${esc(x.name)}</div><div class="public-meta">${esc(x.catName)} • Disponible : <b>${available(x.name)}</b></div><div class="public-step"><button onclick='qty(${JSON.stringify(x.name)},-1,${available(x.name)})'>−</button><strong>${cart[x.name]||0}</strong><button class="p" onclick='qty(${JSON.stringify(x.name)},1,${available(x.name)})'>+</button></div></div></article>`).join('')||'<div class="empty">Aucun matériel disponible.</div>'}
 const n=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('count').textContent=n?`${n} pièce${n>1?'s':''} sélectionnée${n>1?'s':''}`:'';document.getElementById('next').disabled=!n;
}
function showForm(){document.getElementById('search').style.display='none';document.getElementById('nav').innerHTML='';document.getElementById('content').innerHTML=`<div class="public-form"><h2 style="margin-top:0">Finaliser la commande</h2>${Object.entries(cart).map(([n,q])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><b>${esc(n)}</b><span>× ${q}</span></div>`).join('')}<input id="who" placeholder="Nom / prénom *"><input id="team" placeholder="Équipe"><input id="dest" placeholder="Intervention / destination"><textarea id="note" rows="2" placeholder="Remarque (facultatif)"></textarea></div>`;document.getElementById('bottom').innerHTML='<div><button class="public-send" onclick="sendOrder()">Envoyer la commande</button></div>'}
async function sendOrder(){let who=document.getElementById('who').value.trim();if(!who)return alert('Indique ton nom/prénom.');let id=crypto.randomUUID(),num=String(Date.now()).slice(-6),now=new Date().toISOString(),o={id,number:num,requester:who,team:document.getElementById('team').value.trim(),destination:document.getElementById('dest').value.trim(),note:document.getElementById('note').value.trim(),status:'pending',createdAt:now,updatedAt:now,items:Object.entries(cart).map(([name,qty])=>({name,qty,prepared:false}))};let r=await fetch(SUPA+'/rest/v1/app_settings?on_conflict=key',{method:'POST',headers:{...HEAD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:'order:'+id,value:o,updated_at:now})});if(!r.ok)return alert("Erreur lors de l'envoi. Réessaie.");document.querySelector('.public-main').innerHTML=`<div class="public-ok"><div style="font-size:50px">✅</div><h2>Commande envoyée</h2><p>Numéro de commande</p><div class="public-num">${num}</div><p>Garde ce numéro pour récupérer le matériel.</p></div>`;document.getElementById('bottom').remove()}
async function boot(){let s=await get('?key=eq.shared_state&select=value');if(!s[0]?.value?.data)throw Error('state');D=s[0].value.data;normalize();render();try{let p=await get('?key=like.photo%3A%25&select=key,value');for(const x of p)if(x.value?.dataUrl)photos[x.key.slice(6)]=x.value.dataUrl;render()}catch(e){}}
Promise.race([boot(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]).catch(e=>{console.error(e);document.getElementById('content').innerHTML='<div class="empty">Erreur de chargement : '+esc(e.message)+'.</div>'});
</script></body></html>
